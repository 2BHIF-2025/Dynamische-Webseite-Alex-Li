<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Mini Games Hub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-dark bg-dark px-4">
  <span class="navbar-brand mb-0 h1">🎮 Mini Games Hub</span>
</nav>

<!-- Hero -->
<div class="container text-center mt-5">
  <h1 class="text-light">Wähle dein Spiel</h1>
  <p class="text-secondary">Spiele, sammle Punkte und erreiche Highscores!</p>
</div>

<!-- Game Cards -->
<div class="container mt-4">
  <div class="row g-4">

    <!-- Tic Tac Toe -->
    <div class="col-md-3">
      <div class="card game-card text-center p-3">
        <h4>❌⭕ Tic-Tac-Toe</h4>
        <p>Besiege deinen Gegner!</p>
        <a href="tic.html" class="btn btn-primary">Spielen</a>
      </div>
    </div>

    <!-- Memory -->
    <div class="col-md-3">
      <div class="card game-card text-center p-3">
        <h4>🧠 Memory</h4>
        <p>Finde alle Paare!</p>
        <a href="memory.html" class="btn btn-success">Spielen</a>
      </div>
    </div>

    <!-- Zahlenraten -->
    <div class="col-md-3">
      <div class="card game-card text-center p-3">
        <h4>🔢 Zahlenraten</h4>
        <p>Errate die Zahl!</p>
        <a href="guess.html" class="btn btn-warning">Spielen</a>
      </div>
    </div>

    <!-- Quiz -->
    <div class="col-md-3">
      <div class="card game-card text-center p-3">
        <h4>❓ Quiz</h4>
        <p>Teste dein Wissen!</p>
        <a href="quiz.html" class="btn btn-danger">Spielen</a>
      </div>
    </div>

  </div>
</div>

</body>
</html>
