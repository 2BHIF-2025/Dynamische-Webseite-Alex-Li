<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎮 Mini Games Hub</title>
  <style>
    :root {
      --bg:      #0f172a;
      --card:    rgba(30,41,59,0.85);
      --border:  rgba(255,255,255,0.08);
      --primary: #6366f1;
      --green:   #22c55e;
      --yellow:  #f59e0b;
      --red:     #ef4444;
      --text:    #e2e8f0;
      --muted:   #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: linear-gradient(135deg, #0f172a, #020617);
      color: var(--text);
      font-family: 'Segoe UI', sans-serif;
      min-height: 100vh;
    }
    nav {
      background: rgba(15,23,42,0.9);
      border-bottom: 1px solid var(--border);
      padding: .9rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand { font-size: 1.2rem; font-weight: 700; color: var(--text); text-decoration: none; }
    .hs-link {
      color: var(--primary); text-decoration: none;
      border: 1px solid var(--primary); padding: .3rem .8rem;
      border-radius: 8px; font-size: .9rem;
    }
    .hero { text-align: center; padding: 3rem 1rem 1.5rem; }
    .hero h1 { font-size: 2.2rem; margin-bottom: .4rem; }
    .hero p  { color: var(--muted); }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.2rem;
      max-width: 900px;
      margin: 0 auto;
      padding: 1rem 1.5rem 3rem;
    }
    .game-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.8rem 1.2rem;
      text-align: center;
      transition: transform .2s;
    }
    .game-card:hover { transform: translateY(-4px); }
    .game-card .icon { font-size: 2.8rem; margin-bottom: .6rem; }
    .game-card h3 { font-size: 1.1rem; margin-bottom: .4rem; }
    .game-card p  { color: var(--muted); font-size: .88rem; margin-bottom: 1rem; }
    .btn {
      display: inline-block; padding: .5rem 1.4rem;
      border-radius: 10px; text-decoration: none;
      font-weight: 600; color: white;
      transition: filter .2s, transform .2s;
      border: none; cursor: pointer; font-size: .95rem;
    }
    .btn:hover { filter: brightness(1.15); transform: translateY(-2px); color: white; }
    .btn.p { background: var(--primary); }
    .btn.g { background: var(--green); }
    .btn.y { background: var(--yellow); color: #0f172a !important; }
    .btn.r { background: var(--red); }
  </style>
</head>
<body>

<nav>
  <span class="brand">🎮 Mini Games Hub</span>
  <a href="highscores.html" class="hs-link">🏆 Highscores</a>
</nav>

<div class="hero">
  <h1>Wähle dein Spiel</h1>
  <p>Spiele, sammle Punkte und erreiche Highscores!</p>
</div>

<div class="grid">
  <div class="game-card">
    <div class="icon">❌⭕</div>
    <h3>Tic-Tac-Toe</h3>
    <p>Besiege deinen Gegner!</p>
    <a href="tic.html" class="btn p">Spielen</a>
  </div>
  <div class="game-card">
    <div class="icon">🧠</div>
    <h3>Memory</h3>
    <p>Finde alle Paare!</p>
    <a href="memory.html" class="btn g">Spielen</a>
  </div>
  <div class="game-card">
    <div class="icon">🔢</div>
    <h3>Zahlenraten</h3>
    <p>Errate die geheime Zahl!</p>
    <a href="guess.html" class="btn y">Spielen</a>
  </div>
  <div class="game-card">
    <div class="icon">❓</div>
    <h3>Quiz</h3>
    <p>Teste dein Wissen!</p>
    <a href="quiz.html" class="btn r">Spielen</a>
  </div>
</div>

</body>
</html>
